name: record_reccomend
description: >
  Album-first music discovery — local-first, no login, no API keys.
  Terminal app first (Milestone 1); Flutter mobile UI comes later on the same data layer.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqlite3: ^3.5.1
  sqlite3_flutter_libs: ^0.5.24
  http: ^1.2.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
