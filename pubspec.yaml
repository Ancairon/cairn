name: cairn
description: >
  Album-first music discovery — local-first, no login, no API keys.
  Terminal app first (Milestone 1); Flutter mobile UI comes later on the same data layer.
publish_to: 'none'
version: 0.1.14+100

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqlite3: ^3.5.1
  sqlite3_flutter_libs: ^0.5.24
  http: ^1.2.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.0
  dynamic_color: ^1.9.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  path: ^1.9.1
  # share_plus 13.3.0 is required alongside file_picker 12.0.0: file_picker's
  # AGP 9.0+/Kotlin 2.3 incompatibility (present through 11.0.3) was fixed in
  # its 12.x line, but 12.x's win32 constraint conflicts with share_plus
  # 10.1.4's — see SOW-0006 for the full history.
  share_plus: ^13.3.0
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
